[package]
name = "compute-benches"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[build-dependencies]
anyhow.workspace = true

[dependencies]
approx = "0.5.1"
anyhow.workspace = true
criterion = { version = "0.8.2", default-features = false }
cust = { version = "0.3.2", optional = true }
futures = { version = "0.3.34", optional = true }
krnl = { workspace = true, default-features = false }
ocl = { version = "0.19.7", optional = true }
qutex = { version = "0.2.6", optional = true }
rand = "0.10.3"

[dev-dependencies]
num-format = "0.4.4"

[features]
default = ["device"]
device = ["krnl/device"]
#cuda = ["dep:cust"]
ocl = ["dep:ocl", "dep:futures", "dep:qutex"]

[[bench]]
name = "benchmarks"
harness = false
required-features = ["device"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
    'cfg(krnlc)',
] }
