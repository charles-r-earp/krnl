[package]
name = "krnl"
version.workspace = true
authors.workspace = true
edition.workspace = true
#rust-version.workspace = true
description = "Safe, portable, high performance compute (GPGPU) kernels."
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["kernel", "compute", "vulkan", "gpu"]
categories = ["hardware-support", "science", "mathematics"]
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
crate-type = ["rlib", "dylib"]
test = false
doctest = false
bench = false

[target.'cfg(not(target_arch = "spirv"))'.build-dependencies]
krnlc = { workspace = true, default-features = false, features = [
    "use-installed-tools",
    "bindings",
] }

[dependencies]
krnl-core = { workspace = true }
krnl-macros = { workspace = true }
num-traits.workspace = true
dry.workspace = true
paste.workspace = true
half.workspace = true
derive_more = { workspace = true, features = ["display"] }
bytemuck.workspace = true
tinyvec = "1.10.0"

[target.'cfg(target_arch = "spirv")'.dependencies]
spirv-std.workspace = true

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
#krnlc = { workspace = true, default-features = false, features = [
#    "jit",
#], optional = true }
derive_more = { workspace = true, default-features = false, features = [
    "from",
    "deref",
    "deref_mut",
] }
parking_lot = { version = "0.12.4", features = ["arc_lock"] }
bytemuck = { version = "1.23.1", features = ["extern_crate_alloc"] }
fxhash.workspace = true
rayon.workspace = true
num-traits = { workspace = true, default-features = true }
rspirv = { workspace = true, optional = true }

[target.'cfg(not(any(target_family = "wasm", target_arch = "spirv")))'.dependencies]
ash = { version = "0.38.0", optional = true }
vk-mem = { version = "0.4.0", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3.77", features = [
    "Window",
    "Navigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuQueue",
    "GpuBuffer",
    "GpuBufferDescriptor",
    "GpuCommandEncoder",
    "GpuCommandBuffer",
], optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }

[features]
default = ["device"]
device = [
    "dep:ash",
    "dep:vk-mem",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:rspirv",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
    'cfg(krnlc)',
    'cfg(krnlc_pkg, values("krnl"))',
] }
